name: Apply

on:
  push:
    branches: [main]
  schedule:
    # 会議録は開会から数か月たって登録される。毎週月曜 05:00 JST に直近 2 年分を取り直す
    - cron: "0 20 * * 0"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う。
    # contents と pull-requests は、Queria で変更された説明をこのリポジトリに戻す PR に使う
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@03f0facbec0d7795c3b95cbcacedc1d26e500591
    with:
      dataset_name: gijiroku
      # 過去分は手元で GIJIROKU_YEARS=0 にして取る。Sync は今年と昨年の分だけ
      timeout_minutes: 150
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
